name: Tests

on:
  push:
    branches: [v0.2, main]
  pull_request:
    branches: [v0.2, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check --output-format=github --select E9,F63,F7,F82 .
      - run: pytest tests/ -v --tb=short
